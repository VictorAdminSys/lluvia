<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lluvia</title>
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lluvia">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0b1020;
    --bg2: #111933;
    --card: rgba(255,255,255,0.045);
    --card-on: rgba(140,170,230,0.16);
    --line: rgba(255,255,255,0.08);
    --text: #c9d2e6;
    --muted: #6f7b98;
    --accent: #9fb7e8;
    --moon: #e9e3cf;
    --amber: #e6c58f;
    --amber-on: rgba(230,197,143,0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%) fixed;
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  main {
    max-width: 480px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
    min-height: 100%; display: flex; flex-direction: column; gap: 22px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: .2px; color: var(--moon); }
  .estado { font-size: 13px; color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  .sonidos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sonido, .historia {
    appearance: none; border: 1px solid var(--line); background: var(--card);
    color: var(--text); border-radius: 16px; padding: 16px 14px; text-align: left;
    font: inherit; cursor: pointer; transition: background .2s, border-color .2s;
    min-height: 78px; width: 100%;
  }
  .sonido b, .historia b { display: block; font-weight: 600; font-size: 16px; }
  .sonido span, .historia span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .sonido[aria-pressed="true"] { background: var(--card-on); border-color: rgba(159,183,232,.45); }
  .sonido[aria-pressed="true"] b { color: #e3ebff; }
  .sonido:last-child:nth-child(odd) { grid-column: 1 / -1; }

  .historia { display: flex; align-items: center; gap: 14px; }
  .historia svg { width: 28px; height: 28px; flex: none; color: var(--amber); }
  .historia b { color: var(--amber); }
  .historia[aria-pressed="true"] { background: var(--amber-on); border-color: rgba(230,197,143,.45); }

  .ahora {
    display: none; border-left: 2px solid rgba(230,197,143,.5); padding: 2px 0 2px 12px;
  }
  .ahora.visible { display: block; }
  .ahora .titulo { font-size: 15px; color: #efe3cc; line-height: 1.35; -webkit-user-select: text; user-select: text; }
  .ahora .meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  .reproductor { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 4px; }
  #play {
    width: 112px; height: 112px; border-radius: 50%;
    border: 1px solid rgba(159,183,232,.35);
    background: radial-gradient(circle at 50% 40%, rgba(159,183,232,.22), rgba(159,183,232,.06));
    color: var(--moon); cursor: pointer; display: grid; place-items: center;
  }
  #play svg { width: 40px; height: 40px; }
  #play:active { transform: scale(.97); }
  .cuenta { font-variant-numeric: tabular-nums; font-size: 15px; color: var(--accent); min-height: 21px; text-align: center; }

  section h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .8px; }
  .tiempos { display: flex; flex-wrap: wrap; gap: 8px; }
  .tiempo {
    appearance: none; font: inherit; font-size: 14px; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 14px; cursor: pointer;
  }
  .tiempo[aria-pressed="true"] { background: var(--card-on); border-color: rgba(159,183,232,.45); color: #e3ebff; }

  footer { margin-top: auto; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  footer p { margin: 0 0 6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Lluvia</h1>
    <div class="estado" id="estado">En pausa</div>
  </header>

  <div class="sonidos" id="sonidos" role="group" aria-label="Sonido">
    <button class="sonido" data-id="lluvia-suave"><b>Lluvia suave</b><span>Constante y tranquila</span></button>
    <button class="sonido" data-id="tormenta"><b>Tormenta</b><span>Lluvia fuerte y truenos lejanos</span></button>
    <button class="sonido" data-id="ventana"><b>En el coche</b><span>Gotas sobre el techo, desde dentro</span></button>
    <button class="sonido" data-id="mar"><b>Mar</b><span>Olas lentas</span></button>
    <button class="sonido" data-id="ruido-marron"><b>Ruido marrón</b><span>Grave y uniforme, sin sorpresas</span></button>
    <button class="sonido" data-id="ruido-blanco"><b>Ruido blanco</b><span>Siseo uniforme, tapa los ruidos</span></button>
  </div>

  <button class="historia" id="historia" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg>
    <div><b>Historia</b><span id="historia-sub">Un episodio de historia al azar, de una hora más o menos</span></div>
  </button>

  <div class="ahora" id="ahora">
    <div class="titulo" id="ahora-titulo"></div>
    <div class="meta" id="ahora-meta"></div>
  </div>

  <div class="reproductor">
    <button id="play" aria-label="Reproducir"></button>
    <div class="cuenta" id="cuenta"></div>
  </div>

  <section>
    <h2>Apagar tras</h2>
    <div class="tiempos" id="tiempos" role="group" aria-label="Temporizador">
      <button class="tiempo" data-min="0">Nunca</button>
      <button class="tiempo" data-min="15">15 min</button>
      <button class="tiempo" data-min="30">30 min</button>
      <button class="tiempo" data-min="45">45 min</button>
      <button class="tiempo" data-min="60">1 h</button>
      <button class="tiempo" data-min="90">1 h 30</button>
    </div>
  </section>

  <footer>
    <p>El volumen se ajusta con los botones del iPhone.</p>
    <p>Puedes bloquear la pantalla: sigue sonando y se controla desde la pantalla de bloqueo.</p>
    <p>Las historias son episodios de podcasts de iVoox y se escuchan directamente desde su fuente original.</p>
  </footer>
</main>

<audio id="audio" preload="none" playsinline></audio>

<script>
(() => {
  const SONIDOS = {
    "lluvia-suave": "Lluvia suave",
    "tormenta": "Tormenta",
    "ventana": "Lluvia en el coche",
    "mar": "Mar",
    "ruido-marron": "Ruido marrón",
    "ruido-blanco": "Ruido blanco"
  };
  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>';

  const $ = id => document.getElementById(id);
  const audio = $("audio");
  const btnPlay = $("play");
  const estado = $("estado");
  const cuenta = $("cuenta");
  const btnHistoria = $("historia");
  const historiaSub = $("historia-sub");
  const ahora = $("ahora");
  const botonesSonido = [...document.querySelectorAll(".sonido")];
  const botonesTiempo = [...document.querySelectorAll(".tiempo")];

  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const leer = (k, def) => { try { return localStorage.getItem(k) ?? def; } catch (e) { return def; } };
  const leerJSON = (k, def) => { try { return JSON.parse(leer(k, "")) ?? def; } catch (e) { return def; } };

  // ---- estado ----
  let modo = leer("modo", "sonido");                 // "sonido" | "historia"
  let actual = leer("sonido", "lluvia-suave");
  if (!SONIDOS[actual]) actual = "lluvia-suave";
  let historia = leerJSON("historia", null);          // {t,p,u,d,f,pos}
  if (modo === "historia" && !historia) modo = "sonido";
  let minutos = parseInt(leer("minutos", "45"), 10);
  if (isNaN(minutos)) minutos = 45;
  let finEn = null;
  let apagando = false;
  let lista = null;

  const fmtDur = s => { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? (m ? `${h} h ${m} min` : `${h} h`) : `${m} min`; };

  function marcar() {
    botonesSonido.forEach(b => b.setAttribute("aria-pressed", String(modo === "sonido" && b.dataset.id === actual)));
    btnHistoria.setAttribute("aria-pressed", String(modo === "historia"));
    botonesTiempo.forEach(b => b.setAttribute("aria-pressed", String(parseInt(b.dataset.min, 10) === minutos)));
    if (modo === "historia" && historia) {
      ahora.classList.add("visible");
      $("ahora-titulo").textContent = historia.t;
      $("ahora-meta").textContent = `${historia.p} · ${fmtDur(historia.d)}`;
      historiaSub.textContent = "Pulsa otra vez para cambiar a otra distinta";
    } else {
      ahora.classList.remove("visible");
      historiaSub.textContent = "Un episodio de historia al azar, de una hora más o menos";
    }
  }

  function sonando() { return !audio.paused && !audio.ended; }

  function nombreActual() { return modo === "historia" && historia ? historia.p : SONIDOS[actual]; }

  function pintar() {
    const on = sonando();
    btnPlay.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
    btnPlay.setAttribute("aria-label", on ? "Pausar" : "Reproducir");
    estado.textContent = on ? nombreActual() : "En pausa";
    pintarCuenta();
  }

  function pintarCuenta() {
    if (!finEn || !sonando()) { cuenta.textContent = minutos && !sonando() ? `Se apagará ${minutos} min después de empezar` : ""; return; }
    const ms = Math.max(0, finEn - Date.now());
    const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
    cuenta.textContent = `Se apaga en ${m}:${String(s).padStart(2, "0")}`;
  }

  // ---- carga de audio ----
  function cargarSonido(id) {
    const url = new URL(`sonidos/${id}.m4a`, location.href).href;
    audio.loop = true;
    if (audio.src !== url) { audio.src = url; audio.load(); }
  }

  function cargarHistoria(h) {
    audio.loop = false;
    if (audio.src !== h.u) {
      audio.src = h.u;
      audio.load();
      if (h.pos > 30) {
        const irA = () => { try { audio.currentTime = h.pos - 10; } catch (e) {} };
        audio.addEventListener("loadedmetadata", irA, { once: true });
      }
    }
  }

  function armarTemporizador() { finEn = minutos > 0 ? Date.now() + minutos * 60000 : null; }

  async function reproducir() {
    if (modo === "historia" && historia) cargarHistoria(historia); else cargarSonido(actual);
    apagando = false;
    try {
      await audio.play();
      if (!finEn) armarTemporizador();
    } catch (e) {
      estado.textContent = "No se pudo reproducir";
    }
    actualizarSesion();
    pintar();
  }

  function pausar() {
    audio.pause();
    finEn = null;
    guardarPosicion();
    pintar();
  }

  function apagarSuave() {
    if (apagando) return;
    apagando = true;
    let v = audio.volume;
    const paso = () => {
      v -= 0.05;
      try { audio.volume = Math.max(0, v); } catch (e) {}
      if (v > 0 && audio.volume < 1 && sonando()) setTimeout(paso, 300);
      else { pausar(); audio.volume = 1; apagando = false; }
    };
    paso();
  }

  let ultimoGuardado = 0;
  function guardarPosicion() {
    if (modo !== "historia" || !historia || audio.src !== historia.u) return;
    historia.pos = Math.floor(audio.currentTime || 0);
    guardar("historia", JSON.stringify(historia));
  }

  function comprobar() {
    if (finEn && sonando() && Date.now() >= finEn) apagarSuave();
    if (sonando() && Date.now() - ultimoGuardado > 15000) { ultimoGuardado = Date.now(); guardarPosicion(); }
    pintarCuenta();
  }

  function actualizarSesion() {
    if (!("mediaSession" in navigator)) return;
    const esHistoria = modo === "historia" && historia;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: esHistoria ? historia.t : SONIDOS[actual],
      artist: esHistoria ? historia.p : "Lluvia",
      artwork: [
        { src: "iconos/icon-192.png", sizes: "192x192", type: "image/png" },
        { src: "iconos/icon-512.png", sizes: "512x512", type: "image/png" }
      ]
    });
  }

  // ---- historias ----
  async function cargarLista() {
    if (lista) return lista;
    const r = await fetch("historias/historias.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("sin lista");
    lista = await r.json();
    return lista;
  }

  function elegir(todas) {
    let oidas = new Set(leerJSON("oidas", []));
    let libres = todas.filter(h => !oidas.has(h.u));
    if (!libres.length) { oidas = new Set(); libres = todas; }   // se acabaron: vuelta a empezar
    if (historia) {
      const sinLaActual = libres.filter(h => h.u !== historia.u);
      if (sinLaActual.length) libres = sinLaActual;
    }
    const h = libres[Math.floor(Math.random() * libres.length)];
    oidas.add(h.u);
    guardar("oidas", JSON.stringify([...oidas]));
    return { ...h, pos: 0 };
  }

  btnHistoria.addEventListener("click", async () => {
    historiaSub.textContent = "Buscando una historia…";
    try {
      const todas = await cargarLista();
      if (modo === "historia" && historia) guardarPosicion();
      historia = elegir(todas);
      guardar("historia", JSON.stringify(historia));
      modo = "historia";
      guardar("modo", modo);
      finEn = null;
      marcar();
      await reproducir();
    } catch (e) {
      historiaSub.textContent = "No se pudo cargar la lista de historias. Prueba de nuevo en un rato.";
    }
  });

  // ---- controles ----
  if ("mediaSession" in navigator) {
    const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) {} };
    set("play", () => reproducir());
    set("pause", () => pausar());
    set("stop", () => pausar());
    set("seekbackward", () => { if (modo === "historia") audio.currentTime = Math.max(0, audio.currentTime - 15); });
    set("seekforward", () => { if (modo === "historia") audio.currentTime += 30; });
    set("previoustrack", null); set("nexttrack", null);
  }

  botonesSonido.forEach(b => b.addEventListener("click", () => {
    const estabaSonando = sonando();
    if (modo === "historia") guardarPosicion();
    modo = "sonido";
    guardar("modo", modo);
    actual = b.dataset.id;
    guardar("sonido", actual);
    marcar();
    cargarSonido(actual);
    if (estabaSonando) reproducir(); else { actualizarSesion(); pintar(); }
  }));

  botonesTiempo.forEach(b => b.addEventListener("click", () => {
    minutos = parseInt(b.dataset.min, 10);
    guardar("minutos", String(minutos));
    marcar();
    if (sonando()) armarTemporizador();
    pintarCuenta();
  }));

  btnPlay.addEventListener("click", () => sonando() ? pausar() : reproducir());

  audio.addEventListener("play", pintar);
  audio.addEventListener("pause", () => { guardarPosicion(); pintar(); });
  audio.addEventListener("ended", () => {
    if (modo === "historia" && historia) { historia.pos = 0; guardar("historia", JSON.stringify(historia)); }
    finEn = null; pintar();
  });
  // Algunos podcasts publican avances cortos en abierto o enlaces rotos:
  // si el episodio no carga o dura menos de 20 min, se salta solo a otro (máx. 3 intentos seguidos).
  let saltos = 0;
  function saltarHistoria() {
    if (modo !== "historia" || saltos >= 3) {
      estado.textContent = "Este episodio no carga: pulsa Historia para otro";
      return;
    }
    saltos++;
    btnHistoria.click();
  }
  audio.addEventListener("loadedmetadata", () => {
    if (modo !== "historia" || !historia || !isFinite(audio.duration)) return;
    if (!historia.pos && audio.duration < 20 * 60) saltarHistoria();
    else saltos = 0;   // solo se reinicia con un episodio bueno
  });
  audio.addEventListener("error", () => {
    if (!audio.src) return;
    if (modo === "historia") saltarHistoria(); else estado.textContent = "No se pudo cargar el sonido";
  });
  audio.addEventListener("timeupdate", comprobar);   // sigue llegando con la pantalla bloqueada
  setInterval(comprobar, 1000);
  document.addEventListener("visibilitychange", () => { guardarPosicion(); comprobar(); });

  marcar();
  pintar();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
