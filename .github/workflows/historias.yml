name: Actualizar historias

on:
  schedule:
    - cron: "17 4 * * 1"   # lunes 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "historias/actualiza.py"
      - "historias/podcasts.json"
      - ".github/workflows/historias.yml"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer los RSS
        run: python historias/actualiza.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- historias/historias.json && git ls-files --error-unmatch historias/historias.json >/dev/null 2>&1; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add historias/historias.json
          git commit -m "Actualiza la lista de historias"
          git push
